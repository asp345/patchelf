name: "CI"
on:
  pull_request:
  merge_group:
  push:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: shellcheck tests/*.sh tests/run-tests
  nix:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
    - uses: Mic92/hestia@v3
    - run: nix-build -A hydraJobs.release
  ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install cross compilers and qemu for tests/cross-arch.sh
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends qemu-user \
          gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
          gcc-i686-linux-gnu libc6-dev-i386-cross \
          gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
          gcc-powerpc-linux-gnu libc6-dev-powerpc-cross \
          gcc-s390x-linux-gnu libc6-dev-s390x-cross \
          gcc-mips64el-linux-gnuabi64 libc6-dev-mips64el-cross
    - run: |
        rustc --version
        cargo --version
    - run: cargo fmt --check
    - run: cargo clippy --all-targets -- -D warnings
    - run: cargo build --release
    - run: cargo test
    - run: make -C tests -j$(nproc) check
